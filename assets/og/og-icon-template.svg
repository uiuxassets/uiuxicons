<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Open Graph card template for per-icon pages (1200x630).
       Double-brace placeholders (logo/icon SVG, title, title size, tags)
       are filled by scripts/og-images.js. -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Brand row -->
  {{logoSVG}}
  <text x="134" y="81" font-family="Inter" font-size="28" font-weight="500" fill="#a1a1aa">uiuxicons.com</text>

  <!-- Icon tile -->
  <rect x="80" y="150" width="360" height="360" rx="28" fill="#131316" stroke="#3b3b3f" stroke-width="2"/>
  {{iconSVG}}

  <!-- Text block: title, tags, and footer grouped together and vertically
       centered against the icon tile (tile spans y=150..510, center 330) -->
  <text x="520" y="254" font-family="Inter" font-size="{{titleSize}}" font-weight="700" fill="#ffffff">{{title}}</text>
  <text x="520" y="322" font-family="Inter" font-size="28" font-weight="500" fill="#a1a1aa">{{tags}}</text>
  <text x="520" y="382" font-family="Inter" font-size="24" font-weight="500" fill="#71717a">3 styles &#183; 3 weights &#183; MIT licensed</text>
</svg>
